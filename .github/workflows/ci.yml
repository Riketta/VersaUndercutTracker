name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: leafo/gh-actions-lua@v10
        with:
          luaVersion: "5.1"

      - uses: luarocks/gh-actions-luarocks@v5

      - name: Install Lua tooling
        run: |
          luarocks install luacheck 1.2.0-1
          luarocks install busted 2.2.0-1

      - name: Install StyLua
        uses: taiki-e/install-action@v2
        with:
          tool: stylua@2.6.0

      - name: Format check (StyLua)
        run: stylua --check .

      - name: Lint + hexagonal boundary rules (luacheck)
        run: luacheck .

      - name: Unit tests (pure domain, no game client required)
        run: busted --verbose

      - name: TOC coverage guard (every lua file must be loaded by the game)
        run: |
          cd VersaUndercutTracker && lua ../scripts/check_toc.lua VersaUndercutTracker.toc .
          cd ../VUTProbe && lua ../scripts/check_toc.lua VUTProbe.toc .

      - name: Type check (lua-language-server, strict)
        env:
          LLS_VERSION: 3.19.1
        run: |
          # luarocks installs rocks into a workspace-local .luarocks tree (see
          # the LUA_PATH env); LLS --check scans it even with workspace.ignore
          # entries (dot-dir exclusion is unreliable - verified on 3.19.1), so
          # drop the tree before the type check. luacheck excludes the same
          # tree via .luacheckrc instead (it runs before this step).
          rm -rf .luarocks
          curl -fL "https://github.com/LuaLS/lua-language-server/releases/download/${LLS_VERSION}/lua-language-server-${LLS_VERSION}-linux-x64.tar.gz" -o "$RUNNER_TEMP/lls.tar.gz"
          mkdir -p "$RUNNER_TEMP/lls"
          tar -xzf "$RUNNER_TEMP/lls.tar.gz" -C "$RUNNER_TEMP/lls"
          "$RUNNER_TEMP/lls/bin/lua-language-server" --check=./ --checklevel=Warning > ./lls.log 2>&1 || true
          lua scripts/assert_lls_clean.lua ./lls.log

  package:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - name: Build addon zip (main addon only; VUTProbe is a dev tool)
        run: zip -r "${GITHUB_WORKSPACE}/VersaUndercutTracker.zip" VersaUndercutTracker

      - uses: actions/upload-artifact@v4
        with:
          name: VUT
          path: VersaUndercutTracker.zip
